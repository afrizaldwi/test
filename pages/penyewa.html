<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Penyewa</title>
    <link rel="stylesheet" href="../css/globals.css">
    <link rel="stylesheet" href="../css/penyewa.css">
</head>

<body>
    <div class="container">
        <div id="user-section" class="dashboard">
            <div class="d-flex">
                <div class="dashboard-nav d-flex flex-between" id="sidebar">
                    <div class="d-flex flex-between w-full">
                        <h2 class="dashboard-title">Penyewa</h2>
                        <button class="hamburger-menu" onclick="toggleButton()">&#9776;</button>
                    </div>
                    <div class="d-flex flex-1 nav-menu w-full">
                        <a href="#" onclick="getPenyewa()">Beranda</a>
                        <a href="#">Tagihan Saya</a>
                        <a href="#">Lapor Keluhan</a>
                        <a href="#">Profil</a>
                        <button onclick="logout()" class="btn">Logout</button>
                    </div>
                </div>
                <div class="penyewa-content">
                    <h1>Halo, <span id="user-display-name"></span></h1>
                    <div class="card penyewa-info-card">
                        <h2>Informasi Kamar Anda</h2>
                        <hr class="info-divider" />
                        <p>Nomor Kamar: <strong id="penyewa-nomor-kamar">-</strong></p>
                        <p>Fasilitas: <strong id="penyewa-fasilitas">-</strong></p>
                        <p>Status Sewa: <strong id="penyewa-status-sewa">-</strong></p>
                        <p>Tanggal Masuk: <strong id="penyewa-tanggal-masuk">-</strong></p>
                        <p>Tanggal Keluar: <strong id="penyewa-tanggal-keluar">-</strong></p>
                        <hr class="info-divider" />
                        <p>Tagihan Terdekat: <strong id="penyewa-tagihan-nominal">-</strong></p>
                        <p>Jatuh Tempo: <strong id="penyewa-tagihan-jatuh-tempo">-</strong></p>
                        <p>Status: <strong id="penyewa-tagihan-status">-</strong></p>
                        <hr class="info-divider" />
                        <p>Keluhan Pending: <strong id="penyewa-keluhan-pending">-</strong></p>
                        <button class="btn mt-1">Bayar Sekarang</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/penyewa.js"></script>
</body>

</html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistem Manajemen Kost</title>
  <link rel="stylesheet" href="css/globals.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>

<body>
  <div class="container w-full">
    <div class="form-warp" id="login-section">
      <form class="d-flex card" id="login-form">
        <span id="login-error" class="alert hidden">Email atau password salah!</span>
        <h1>Login Sistem Kost</h1>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="text" class="form-input" id="email" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="password" required />
        </div>
        <div class="d-flex btn-group w-full">
          <button type="submit" class="btn">Masuk</button>
        </div>
      </form>
    </div>
  </div>
  <script src="./js/login.js"></script>
</body>

</html>
